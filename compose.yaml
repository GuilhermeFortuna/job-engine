services:
  postgres:
    image: postgres:17.11
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_engine}
      POSTGRES_USER: ${POSTGRES_USER:-job_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_engine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
