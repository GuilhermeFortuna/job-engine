name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install backend dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Check code formatting (Ruff)
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Lint source code (Ruff)
        working-directory: apps/api
        run: uv run ruff check .

      - name: Strict type check (Mypy)
        working-directory: apps/api
        run: uv run mypy src tests

  backend-test:
    name: Backend Test Suite (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: job_engine
          POSTGRES_USER: job_engine
          POSTGRES_PASSWORD: job_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install backend dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Run Alembic database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://job_engine:job_engine@127.0.0.1:5432/job_engine
        run: uv run alembic upgrade head

      - name: Run Pytest test suite
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://job_engine:job_engine@127.0.0.1:5432/job_engine
        run: uv run pytest

  frontend-check:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check and ESLint
        run: pnpm --filter @job-engine/web run check

  frontend-unit-test:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest suite
        run: pnpm --filter @job-engine/web run test

  frontend-e2e:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js web application
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8088
        run: pnpm --filter @job-engine/web run build

      - name: Install Playwright browsers and system dependencies
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: pnpm --filter @job-engine/web run test:e2e

      - name: Upload Playwright test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  ci-status:
    name: CI Status Gate
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - backend-test
      - frontend-check
      - frontend-unit-test
      - frontend-e2e
    if: always()
    steps:
      - name: Evaluate pipeline results
        run: |
          if [ "${{ needs.backend-check.result }}" != "success" ] || \
             [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-check.result }}" != "success" ] || \
             [ "${{ needs.frontend-unit-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-e2e.result }}" != "success" ]; then
            echo "❌ CI pipeline failed."
            exit 1
          fi
          echo "✅ All CI checks passed successfully."
