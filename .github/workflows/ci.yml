name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Backend lint and typecheck
        run: ./scripts/ci-backend-check.sh

  backend-build:
    name: Backend Build Smoke (clean checkout)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Backend build smoke check
        run: ./scripts/ci-backend-build.sh

  backend-test:
    name: Backend Test Suite (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: job_engine
          POSTGRES_USER: job_engine
          POSTGRES_PASSWORD: job_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Backend migrations and pytest
        env:
          DATABASE_URL: postgresql://job_engine:job_engine@127.0.0.1:5432/job_engine
        run: ./scripts/ci-backend-test.sh

  frontend-check:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Frontend type check and ESLint
        run: ./scripts/ci-frontend-check.sh

  frontend-unit-test:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Frontend Vitest suite
        run: ./scripts/ci-frontend-test.sh

  frontend-e2e:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Frontend Playwright E2E suite
        run: ./scripts/ci-frontend-e2e.sh

      - name: Upload Playwright test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  ci-status:
    name: CI Status Gate
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - backend-build
      - backend-test
      - frontend-check
      - frontend-unit-test
      - frontend-e2e
    if: always()
    steps:
      - name: Evaluate pipeline results
        run: |
          if [ "${{ needs.backend-check.result }}" != "success" ] || \
             [ "${{ needs.backend-build.result }}" != "success" ] || \
             [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-check.result }}" != "success" ] || \
             [ "${{ needs.frontend-unit-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-e2e.result }}" != "success" ]; then
            echo "CI pipeline failed."
            exit 1
          fi
          echo "All CI checks passed successfully."
